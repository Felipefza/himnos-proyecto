{% load static %} {% load bootstrap5 %}

<!doctype html>

<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <link rel="stylesheet" href="{% static 'css/bootstrap.css' %}" />
        {% bootstrap_javascript %}
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

        <script
            type="text/javascript"
            src="{% static 'js/htmx.min.js' %}"
            defer
        ></script>

        <script src="{% static 'js/apiAdmin/logoutAdmin.js' %}"></script>

        <script>
        const descartar = () => {
            window.location.href = "/administrador/";
        }
        </script>

        <title>Añadir Himno</title>
    </head>

    <body>
        {% include 'apiAdmin/navbar.html' %}

        <main class="container mt-5 mb-5 h-100 w-100 min-vh-100">
            <form class="container" action="/administrador/modificar/{{himno.himno_id}}/" method="post">
                {% csrf_token %}

                <div class="row g-4">
                    <div class="col-auto">
                        <input class="form-control bg-light shadow" type="text" name="numero" placeholder="Ingrese el Número..." value="{{ himno.numero }}" required>
                    </div>
                    <div class="col-lg-9 col-md-6 col-auto">
                        <input class="form-control bg-light shadow" type="text" name="titulo" placeholder="Ingrese el Titulo..." value="{{ himno.titulo }}" required>
                    </div>
                </div>

                <ul id="list-ul" class="list-group list-group-numbered">
                    {% for item in parrafos %}
                        {% if forloop.counter in coros_ids %}
                        <li class="list-group-item bg-light shadow card d-flex flex-row align-items-center mb-5 mt-5 fs-4 draggable-list" data-id="{{ forloop.counter0 }}">
                            <div class="d-flex flex-row align-items-center w-100 bg-light" draggable="true">
                                <span>
                                    <i class="bi bi-grip-horizontal" style="font-size: 3rem;"></i>
                                </span>
                                <div class="container m-3">
                                    <select class="form-select mb-2 w-auto" name="opcionParrafo">
                                        <option value="coro" selected>Coro</option>
                                        <option value="parrafo">Parrafo</option>
                                    </select>
                                    <textarea class="form-control" rows="8" placeholder="Ingrese el Parrafo..." name="textoParrafo" required>{{ item.parrafo }}</textarea>
                                </div>
                            </div>
                            <button type="button" class="btn" onClick="removeParrafo({{ forloop.counter0 }})">
                                <i class="bi bi-trash-fill" style="font-size: 2rem;"></i>
                            </button>
                        </li>
                        {% else %}
                        <li class="list-group-item bg-light shadow card d-flex flex-row align-items-center mb-5 mt-5 fs-4 draggable-list" data-id="{{ forloop.counter0 }}">
                            <div class="d-flex flex-row align-items-center w-100 bg-light" draggable="true">
                                <span>
                                    <i class="bi bi-grip-horizontal" style="font-size: 3rem;"></i>
                                </span>
                                <div class="container m-3">
                                    <select class="form-select mb-2 w-auto" name="opcionParrafo">
                                        <option value="parrafo" selected>Parrafo</option>
                                        <option value="coro">Coro</option>
                                    </select>
                                    <textarea class="form-control" rows="8" placeholder="Ingrese el Parrafo..." name="textoParrafo" required>{{ item.parrafo }}</textarea>
                                </div>
                            </div>
                            <button type="button" class="btn" onClick="removeParrafo({{ forloop.counter0 }})">
                                <i class="bi bi-trash-fill" style="font-size: 2rem;"></i>
                            </button>
                        {% endif %}
                    {% endfor %}

                </ul>

                <div class="container w-100 d-flex justify-content-center mt-5">
                    <button type="button" class="agregarContenedor btn btn-outline-secondary shadow w-auto justify-self-center" style="border-style: dashed;" onClick="addParrafo()">
                        Agregar Parrafo
                    </button>
                </div>

                <div class="container d-flex flex-row-reverse mt-5">
                    <button type="button" class="m-3 btn btn-danger" onClick="descartar()">Descartar</button>
                    <button type="submit" class="m-3 btn btn-success">Guardar Cambios</button>
                </div>
            </form>
        </main>

        {% include 'share/footer.html' %}

        <script src="{% static 'js/agregarHimno/apiAdmin/modificarHimnoDrag.js' %}"></script>
    </body>
</html>
